name: podman-compat

# Checks that the same docker-compose.yml runs under rootless Podman (podman-compose),
# with no Docker involved. Manual only, so it doesn't add load to every push.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/podman.yml"]

jobs:
  podman:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          podman version
          pip install --user podman-compose==1.3.0
          podman-compose version
      - name: Configure
        run: cp .env.example .env
      - name: Build and start (rootless Podman)
        run: podman-compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:18000/health && exit 0
            sleep 5
          done
          echo "API never became healthy"; exit 1
      - name: Seed data
        run: podman-compose exec api python scripts/seed.py
      - name: Ask a question (extractive mode, no LLM key) and check citations
        run: |
          KEY=$(curl -fsS -XPOST http://127.0.0.1:18000/auth/keys -H 'Content-Type: application/json' \
                -d '{"company_name":"CI","tier":"pro"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['api_key'])")
          curl -fsS -XPOST http://127.0.0.1:18000/ask -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
               -d '{"question":"When did China ban gallium exports to the United States?"}' > ask.json
          python3 - <<'EOF'
          import json
          d = json.load(open("ask.json"))["data"]
          print(d["answer"][:300])
          assert d["citations"], "no citations returned"
          print("citations:", len(d["citations"]))
          EOF
      - name: n8n is up
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:15678/healthz && exit 0; sleep 5; done
          exit 1
      - name: Diagnostics
        if: always()
        run: |
          podman-compose ps || true
          podman-compose logs --tail 40 || true
      - name: Tear down
        if: always()
        run: podman-compose down -v || true
