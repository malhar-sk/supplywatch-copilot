name: supplywatch-copilot

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplywatch
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplywatch"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: "1.0"

  api:
    build: ./app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/supplywatch
      ENABLE_SCHEDULER: "${ENABLE_SCHEDULER:-false}"
      LLM_CACHE_DIR: /app/.llm_cache
      CORPUS_DIR: /data/corpus
      OMP_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    volumes:
      - ./data:/data:ro
      - ./evals:/evals:ro
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 40
    mem_limit: 1400m
    cpus: "1.0"

volumes:
  pgdata:
