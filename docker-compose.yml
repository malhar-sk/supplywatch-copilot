name: supplywatch-copilot

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplywatch
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplywatch"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: "1.0"

  api:
    build: ./app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/supplywatch
      ENABLE_SCHEDULER: "${ENABLE_SCHEDULER:-false}"
      LLM_CACHE_DIR: /app/.llm_cache
      CORPUS_DIR: /data/corpus
      OMP_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    volumes:
      - ./data:/data:ro
      - ./evals:/evals:ro
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 40
    mem_limit: 1400m
    cpus: "1.0"

  n8n:
    image: n8nio/n8n:1.123.99
    # Import + activate the shipped workflow on every start, then run n8n.
    entrypoint: ["/bin/sh", "-c", "n8n import:workflow --input=/workflows/risk_alert.json && n8n update:workflow --id=swRiskAlert01 --active=true; exec n8n start"]
    environment:
      N8N_PORT: "5678"
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-15678}/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto,fs"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      GENERIC_TIMEZONE: UTC
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-dev-webhook-secret}  # must match the API (same .env)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-15678}:5678"
    volumes:
      - n8n_home:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n_data:/home/node/alerts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
    mem_limit: 768m
    cpus: "1.0"

volumes:
  pgdata:
  n8n_home:
